<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nanum+Pen+Script&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --check:#f2c9d1;--cream:#fdf4ea;--rose:#d46a80;--rose-dark:#9c2f49;
  --maroon:#7a2038;--paper:#fbf2e3;--ink:#4a2e2e;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  min-height:100%;color:var(--ink);
  font-family:'Patrick Hand',cursive,ui-sans-serif,system-ui;
  background-color:var(--cream);
  background-image:
    repeating-linear-gradient(90deg,var(--check) 0 26px,transparent 26px 58px,var(--check) 58px 84px,transparent 84px 116px),
    repeating-linear-gradient(0deg,var(--check) 0 26px,transparent 26px 58px,var(--check) 58px 84px,transparent 84px 116px);
  background-blend-mode:multiply;
  overflow-x:hidden;
}

/* ── INTRO / BOUQUET ── */
#intro{
  position:fixed;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 28%,#2a1420,#140a10 70%);
  color:#f3e6e0;text-align:center;
  transition:opacity .6s ease,visibility .6s;overflow:hidden;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none;}

/* ── BOUQUET STAGE ── */
.bouquet{
  position:relative;
  width:min(96vw,560px);
  height:min(96vw,560px);
  margin-bottom:0;
}

/* each stem */
.stem{
  position:absolute;bottom:0;
  width:8px;
  background:linear-gradient(#6aaa60,#3d6636);
  transform-origin:bottom center;
  transform:translateX(-50%) scaleY(0);
  border-radius:6px 6px 3px 3px;
  animation:grow .75s ease forwards;
}
/* the flower emoji sits on top */
.stem i{
  position:absolute;top:-10px;left:50%;
  transform:translate(-50%,-100%) scale(0);
  animation:pop .55s ease forwards;
  display:inline-block;line-height:1;
  user-select:none;
}
/* small leaf accent on some stems */
.stem::before{
  content:'🍃';
  position:absolute;font-size:1.3rem;
  top:30%;left:-14px;
  opacity:0;
  animation:leafPop .4s ease forwards;
}
.stem::after{
  content:'🍃';
  position:absolute;font-size:1.2rem;
  top:55%;right:-14px;
  opacity:0;transform:scaleX(-1);
  animation:leafPop .4s ease forwards;
}
@keyframes grow{to{transform:translateX(-50%) scaleY(1);}}
@keyframes pop{to{transform:translate(-50%,-100%) scale(1);}}
@keyframes leafPop{to{opacity:.85;}}

/* BACK ROW – widest spread, tallest, smallest flowers */
/* left wing */
.stA1{height:44%;left:4%; animation-delay:.05s;} .stA1::before{animation-delay:.55s;} .stA1::after{animation-delay:.58s;} .stA1 i{font-size:3.4rem;animation-delay:.72s;}
.stA2{height:50%;left:10%;animation-delay:.10s;} .stA2::before{animation-delay:.60s;} .stA2::after{animation-delay:.63s;} .stA2 i{font-size:3.6rem;animation-delay:.77s;}
.stA3{height:57%;left:17%;animation-delay:.14s;} .stA3::before{animation-delay:.64s;} .stA3::after{animation-delay:.67s;} .stA3 i{font-size:3.8rem;animation-delay:.81s;}
/* right wing */
.stA4{height:44%;left:96%;animation-delay:.05s;} .stA4::before{animation-delay:.55s;} .stA4::after{animation-delay:.58s;} .stA4 i{font-size:3.4rem;animation-delay:.72s;}
.stA5{height:50%;left:90%;animation-delay:.10s;} .stA5::before{animation-delay:.60s;} .stA5::after{animation-delay:.63s;} .stA5 i{font-size:3.6rem;animation-delay:.77s;}
.stA6{height:57%;left:83%;animation-delay:.14s;} .stA6::before{animation-delay:.64s;} .stA6::after{animation-delay:.67s;} .stA6 i{font-size:3.8rem;animation-delay:.81s;}

/* MID ROW – medium height and spread */
.stB1{height:63%;left:23%;animation-delay:.22s;} .stB1::before{animation-delay:.72s;} .stB1::after{animation-delay:.74s;} .stB1 i{font-size:4.2rem;animation-delay:.89s;}
.stB2{height:70%;left:30%;animation-delay:.27s;} .stB2::before{animation-delay:.77s;} .stB2::after{animation-delay:.79s;} .stB2 i{font-size:4.5rem;animation-delay:.94s;}
.stB3{height:63%;left:77%;animation-delay:.22s;} .stB3::before{animation-delay:.72s;} .stB3::after{animation-delay:.74s;} .stB3 i{font-size:4.2rem;animation-delay:.89s;}
.stB4{height:70%;left:70%;animation-delay:.27s;} .stB4::before{animation-delay:.77s;} .stB4::after{animation-delay:.79s;} .stB4 i{font-size:4.5rem;animation-delay:.94s;}

/* FRONT ROW – tallest centre, biggest flowers */
.stC1{height:73%;left:37%;animation-delay:.35s;} .stC1::before{animation-delay:.85s;} .stC1::after{animation-delay:.87s;} .stC1 i{font-size:5.0rem;animation-delay:1.02s;}
.stC2{height:82%;left:50%;animation-delay:.40s;} .stC2::before{animation-delay:.90s;} .stC2::after{animation-delay:.92s;} .stC2 i{font-size:5.6rem;animation-delay:1.07s;}
.stC3{height:73%;left:63%;animation-delay:.35s;} .stC3::before{animation-delay:.85s;} .stC3::after{animation-delay:.87s;} .stC3 i{font-size:5.0rem;animation-delay:1.02s;}

/* tiny filler buds at base */
.stD1{height:28%;left:44%;width:5px;animation-delay:.48s;} .stD1::before{content:none;} .stD1::after{content:none;} .stD1 i{font-size:2.6rem;animation-delay:1.14s;}
.stD2{height:24%;left:56%;width:5px;animation-delay:.50s;} .stD2::before{content:none;} .stD2::after{content:none;} .stD2 i{font-size:2.4rem;animation-delay:1.16s;}
.stD3{height:30%;left:34%;width:5px;animation-delay:.52s;} .stD3::before{content:none;} .stD3::after{content:none;} .stD3 i{font-size:2.5rem;animation-delay:1.18s;}
.stD4{height:26%;left:66%;width:5px;animation-delay:.54s;} .stD4::before{content:none;} .stD4::after{content:none;} .stD4 i{font-size:2.4rem;animation-delay:1.20s;}

/* ribbon wrap */
.ribbon-wrap{
  position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);
  width:62%;height:22%;
  background:linear-gradient(160deg,#e8909a,#c97a82,#9c2f49);
  clip-path:polygon(12% 0%,88% 0%,100% 100%,0% 100%);
  border-radius:0 0 8px 8px;
  opacity:0;
  animation:fadeIn .5s 1.35s ease forwards;
  z-index:2;
}
/* bow */
.bow{
  position:absolute;bottom:18%;left:50%;
  transform:translateX(-50%);
  width:70px;height:36px;
  opacity:0;
  animation:fadeIn .5s 1.4s ease forwards;
  z-index:3;
}
.bow::before,.bow::after{
  content:'';position:absolute;top:0;
  width:30px;height:30px;
  border-radius:50% 50% 0 50%;
  background:#e8909a;
}
.bow::before{left:0;transform:rotate(-30deg);}
.bow::after{right:0;transform:rotate(30deg) scaleX(-1);}
.bow-knot{
  position:absolute;bottom:18%;left:50%;
  transform:translate(-50%,-10%);
  width:22px;height:22px;
  background:radial-gradient(circle at 35% 30%,#f4c0c8,#c97a82);
  border-radius:50%;
  opacity:0;animation:fadeIn .4s 1.45s ease forwards;
  z-index:4;
}

/* text + button */
#introText{
  font-family:'Caveat',cursive;font-weight:700;
  font-size:clamp(1.4rem,5vw,2rem);
  opacity:0;animation:fadeUp .7s 1.7s ease forwards;
  margin-top:18px;padding:0 1rem;line-height:1.35;
}
#introBtn{
  margin-top:18px;opacity:0;
  animation:fadeUp .7s 2.0s ease forwards;
  background:#f3e6e0;color:var(--rose-dark);
  border:none;font-family:'Caveat',cursive;font-weight:700;
  font-size:1.3rem;padding:13px 36px;border-radius:999px;cursor:pointer;
  box-shadow:0 4px 18px rgba(122,32,56,0.35);
  transition:transform .18s,box-shadow .18s;
}
#introBtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(122,32,56,0.42);}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{to{opacity:1;}}

/* ── MAIN PAGE ── */
#main{display:none;}
#main.show{display:block;animation:pageIn .6s ease;}
@keyframes pageIn{from{opacity:0;}to{opacity:1;}}
.wrap{max-width:760px;margin:0 auto;padding:56px 22px 90px;position:relative;}
.tape{position:absolute;width:74px;height:26px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.08);}
.sticker{position:absolute;font-size:1.9rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));user-select:none;pointer-events:none;}
header{text-align:center;margin-bottom:50px;position:relative;}
.tape.t1{top:-4px;left:calc(50% - 130px);transform:rotate(-8deg);}
h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(3rem,10vw,4.6rem);color:var(--rose-dark);margin:18px 0 8px;line-height:1;}
header p{max-width:42ch;margin:0 auto;font-size:1.2rem;line-height:1.5;color:#6b4444;}
.s1{top:-10px;right:8%;}.s2{top:20px;left:6%;}.s3{bottom:-22px;right:14%;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;position:relative;}
.env{
  position:relative;height:190px;cursor:pointer;border:none;padding:0;background:none;
  filter:drop-shadow(0 6px 10px rgba(122,32,56,.18));
  opacity:0;transform:translateY(16px) scale(.96);
  animation:envIn .5s ease forwards;
}
@keyframes envIn{to{opacity:1;transform:none;}}
.env:hover{transform:translateY(-4px) rotate(-1deg);transition:transform .2s;}
.env .shape{
  position:absolute;inset:0;
  clip-path:polygon(0 22%,50% 0%,100% 22%,100% 100%,0% 100%);
  background:linear-gradient(160deg,var(--rose),var(--maroon));
}
.env .tag{
  position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);
  background:var(--cream);color:var(--rose-dark);
  font-family:'Caveat',cursive;font-weight:700;
  font-size:1rem;letter-spacing:.03em;padding:4px 13px;border-radius:3px;
}
.env .label{
  position:absolute;bottom:26px;left:50%;transform:translate(-50%,0);width:85%;
  background:#fff;color:var(--maroon);
  font-family:'Nanum Pen Script',cursive;font-size:1.4rem;
  text-align:center;padding:7px 5px;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.12);
}
.env .seal{
  position:absolute;top:15%;left:50%;transform:translate(-50%,0);
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f2b6c2,var(--rose-dark));
}

/* letter overlay */
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(74,20,32,.55);backdrop-filter:blur(2px);padding:22px;}
.overlay.open{display:flex;}
.letter{
  max-width:540px;width:100%;max-height:82vh;overflow-y:auto;position:relative;
  background:var(--paper);border-radius:4px;padding:48px 32px 36px;
  background-image:repeating-linear-gradient(var(--paper) 0 34px,#e6c9ce33 34px 35px);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
  animation:rise .35s ease;
}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.letter h2{font-family:'Caveat',cursive;font-weight:700;color:var(--rose-dark);font-size:2.3rem;text-align:center;margin:0 0 20px;}
.letter .body{font-family:'Nanum Pen Script',cursive;font-size:1.55rem;line-height:1.85;white-space:pre-line;color:#4a2e2e;}
.letter .htape{position:absolute;top:-10px;left:calc(50% - 40px);width:80px;height:24px;background:rgba(255,255,255,.6);transform:rotate(-4deg);}
.close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.5rem;color:var(--rose-dark);cursor:pointer;}

/* nav buttons inside letter */
.letter-nav{
  display:flex;gap:10px;margin-top:28px;justify-content:space-between;
}
.nav-btn{
  flex:1;padding:10px 0;
  font-family:'Caveat',cursive;font-weight:700;font-size:1.1rem;
  border:2px solid var(--rose-dark);background:#fff;color:var(--rose-dark);
  border-radius:999px;cursor:pointer;transition:background .18s,color .18s;
}
.nav-btn:hover{background:var(--rose-dark);color:#fff;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.next{background:var(--rose-dark);color:#fff;}
.nav-btn.next:hover{opacity:.85;}

footer{text-align:center;margin-top:60px;font-family:'Caveat',cursive;font-size:1.3rem;color:var(--rose-dark);}

@media(prefers-reduced-motion:reduce){
  .letter,.env{animation:none;opacity:1;transform:none;}
  .stem,.stem i,.stem::before,.stem::after,.ribbon-wrap,.bow,.bow-knot,#introText,#introBtn{animation:none;transform:none;opacity:1;}
}
</style>
</head>
<body>

<!-- ══ INTRO BOUQUET ══ -->
<div id="intro">
  <div class="bouquet">

    <!-- BACK ROW (outer wings, shorter) -->
    <div class="stem stA1"><i>🌸</i></div>
    <div class="stem stA2"><i>🌷</i></div>
    <div class="stem stA3"><i>🌺</i></div>
    <div class="stem stA4"><i>🌸</i></div>
    <div class="stem stA5"><i>🌷</i></div>
    <div class="stem stA6"><i>🌺</i></div>

    <!-- MID ROW -->
    <div class="stem stB1"><i>🌷</i></div>
    <div class="stem stB2"><i>🌹</i></div>
    <div class="stem stB3"><i>🌷</i></div>
    <div class="stem stB4"><i>🌹</i></div>

    <!-- FRONT ROW – centre, tallest, biggest -->
    <div class="stem stC1"><i>🌺</i></div>
    <div class="stem stC2"><i>🌹</i></div>
    <div class="stem stC3"><i>🌺</i></div>

    <!-- TINY FILLER BUDS -->
    <div class="stem stD1"><i>🌸</i></div>
    <div class="stem stD2"><i>🌷</i></div>
    <div class="stem stD3"><i>🌼</i></div>
    <div class="stem stD4"><i>🌼</i></div>

    <!-- ribbon + bow -->
    <div class="ribbon-wrap"></div>
    <div class="bow"></div>
    <div class="bow-knot"></div>
  </div>

  <p id="introText">a little bouquet I grew just for you 🌿<br>open your letters inside ↓</p>
  <button id="introBtn">open it 💌</button>
</div>

<!-- ══ MAIN PAGE ══ -->
<div id="main">
  <div class="wrap">
    <header>
      <div class="tape t1"></div>
      <span class="sticker s1">🌸</span>
      <span class="sticker s2">🎀</span>
      <span class="sticker s3">✨</span>
      <h1>Open When...</h1>
      <p>Nine little letters for you — tap one whenever that feeling finds you. Happy birthday, jaan 💌</p>
    </header>
    <div class="grid" id="grid"></div>
    <footer>— written by me, for you, always 🌹</footer>
  </div>
</div>

<!-- ══ LETTER OVERLAY ══ -->
<div class="overlay" id="overlay">
  <div class="letter">
    <div class="htape"></div>
    <button class="close" id="closeBtn">✕</button>
    <h2 id="letterTitle"></h2>
    <div class="body" id="letterBody"></div>
    <div class="letter-nav">
      <button class="nav-btn prev" id="btnPrev">← Prev</button>
      <button class="nav-btn next" id="btnNext">Next →</button>
    </div>
  </div>
</div>

<script>
const letters = [
  {
    title:"Happy Birthday, my love",
    body:"Good morning, beautiful.\n\nBefore the day starts, before your phone lights up — I need you to know that you are the first thought I have today. You always are. But today feels different, because today the whole world gets to celebrate the person I get to love every single day.\n\nYou were born on a day the universe decided to do something extraordinary. And it's been extraordinary ever since.\n\nHappy Birthday, my love. Every single part of today is yours."
  },
  {
    title:"You Can't Sleep",
    body:"Hey. It's late, and the thoughts are loud tonight — I know that feeling.\n\n2am has a way of making everything heavier than it actually is. Every worry expands. Every unfinished thing takes up too much space.\n\nBut here's what's true right now: you are safe. You are loved. Whatever is sitting heavy on your chest tonight — it is not permanent. Morning always comes.\n\nClose your eyes. Let your breath slow down. Somewhere, I'm thinking of you too — and sending you all the quiet and calm in the world.\n\nYou're allowed to rest. You've earned it."
  },
  {
    title:"You're Having a Bad Day",
    body:"Today is being unkind to you. I'm sorry for that.\n\nI wish I could be right there. I wouldn't even say anything useful — I'd just sit next to you. Maybe make a ridiculous face until you at least rolled your eyes at me.\n\nBad days are not prophecies. They don't tell you anything true about who you are or what comes next. They are just days — heavy, unfair, exhausting, and temporary.\n\nYou have gotten through every hard day before this one. Your track record is perfect.\n\nYou don't have to be okay right now. But you are so, so loved — especially on the hard ones."
  },
  {
    title:"You Need to Remember Your Worth",
    body:"Let me tell you what I actually see when I look at you.\n\nI see someone who feels things fully and loves without holding back. Who shows up even when it costs her something. Who makes every room warmer just by being in it — not because she's trying to, but because that's just what she does.\n\nThe world is loudly telling you you're not enough. I'm telling you that is a lie.\n\nYou are not too much. You are not not enough. You are exactly, precisely, completely everything.\n\nCome back to this whenever you forget. I'll still be saying the same thing."
  },
  {
    title:"You Need a Good Laugh",
    body:"Okay. We need to talk about us for a second.\n\nWe are genuinely, objectively, a little ridiculous. The inside jokes that make no sense to anyone but us. The completely unhinged conversations at midnight. The way we make the most boring things — errands, traffic, waiting — somehow turn into a story.\n\nI think about those moments a lot. Not the big ones. The small, stupid, insignificant ones that somehow become the ones I remember most.\n\nYou make my life so much funnier. And I didn't know I needed that until I had it — and now I can't imagine anything without it.\n\nAlso I know something embarrassing about you and I will never let you forget it. You know which one. 😌"
  },
  {
    title:"You Miss Me",
    body:"I miss you too. I always do when we're apart.\n\nHere's the strange thing about missing you — it doesn't feel empty. It feels full. Like a warm, aching weight. Like proof of something real and worth missing.\n\nI notice the small things when you're not here. The quiet that doesn't feel right. The way I think of something funny and immediately want to tell you first.\n\nThe distance between us is just geography. What we actually have doesn't care about geography.\n\nCount down. Come back to me. I'll be exactly where you left me — waiting, and already smiling about it."
  },
  {
    title:"You Achieved Something Big",
    body:"I knew it.\n\nNo, I'm serious — I knew it before you did. I've been watching you quietly work towards this. Watching you push. Watching you refuse to quit even when it would have been so much easier to.\n\nAnd you did it anyway.\n\nThis is yours. Every single piece of it — not luck, not timing. You. Your effort, your intelligence, your refusal to give up.\n\nI am so proud of you I don't have the words for it. I am genuinely honoured to be in your life watching you become everything you are.\n\nCelebrate. Properly. You have absolutely earned it."
  },
  {
    title:"We Just Had a Fight",
    body:"I'm writing this in a quiet moment — no tension, no hurt feelings. Just me, thinking about you, wanting you to have this for exactly this moment.\n\nWhatever just happened — whatever was said — I love you through it. Fully. Without conditions.\n\nI don't want to win. I never want to win. I want us to be okay. I will always choose us over being right.\n\nWe are two people trying their best, with all our flaws and bad days. We are not perfect. But we are worth finding our way back to each other.\n\nI'd rather try — imperfectly, messily, stubbornly — with you, than be uncomplicated with anyone else.\n\nCome back to me when you're ready. I'll be here."
  },
  {
    title:"You Just Want to Feel Loved",
    body:"Then feel this, completely:\n\nI love you in the ordinary moments — the quiet mornings, the boring evenings, all the in-between times that don't make for good stories but make for a life. I love you in those most of all.\n\nI love you in the way I notice small things about you that you probably don't notice yourself. The way you laugh before you finish the funny part. The way you get when something genuinely excites you.\n\nI love you on your best days and your worst days and all the unremarkable days in between.\n\nYou are my favourite chapter. My favourite decision. My favourite person in every room you walk into.\n\nHappy Birthday, my love. This whole bouquet — every letter, every word — it's all yours. Just like I am. Always. 🌹"
  }
];

let currentIdx = 0;

// Build envelope cards
const grid = document.getElementById('grid');
letters.forEach((l, i) => {
  const btn = document.createElement('button');
  btn.className = 'env';
  btn.style.animationDelay = (i * 0.09) + 's';
  const shortTitle = l.title.replace('Happy Birthday, my love','Happy Birthday');
  btn.innerHTML = `<span class="shape"></span><span class="seal"></span><span class="tag">OPEN WHEN</span><span class="label">${shortTitle}</span>`;
  btn.addEventListener('click', () => openLetter(i));
  grid.appendChild(btn);
});

const overlay = document.getElementById('overlay');

function openLetter(i) {
  currentIdx = i;
  document.getElementById('letterTitle').textContent = letters[i].title;
  document.getElementById('letterBody').textContent = letters[i].body;
  document.getElementById('btnPrev').disabled = (i === 0);
  document.getElementById('btnNext').disabled = (i === letters.length - 1);
  overlay.classList.add('open');
  overlay.querySelector('.letter').scrollTop = 0;
}

document.getElementById('closeBtn').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentIdx > 0) openLetter(currentIdx - 1);
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (currentIdx < letters.length - 1) openLetter(currentIdx + 1);
});

// intro → main
document.getElementById('introBtn').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hide');
  document.getElementById('main').classList.add('show');
});
</script>
</body>
</html>
